# payment_db: one PostgreSQL per service, data on a PersistentVolumeClaim
apiVersion: v1
kind: Service
metadata:
  name: payment-db
  labels: {app: payment-db}
spec:
  clusterIP: None
  selector: {app: payment-db}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-db
  labels: {app: payment-db}
spec:
  serviceName: payment-db
  replicas: 1
  selector:
    matchLabels: {app: payment-db}
  template:
    metadata:
      labels: {app: payment-db, tier: database}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=200", "-c", "log_min_messages=warning"]
          env:
            - {name: POSTGRES_DB, value: payment_db}
            - {name: POSTGRES_USER, value: payment_svc}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-passwords, key: PAYMENT_DB_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
data:
  LOG_LEVEL: INFO
  GATEWAY_URL: http://mock-bank-gateway:8099
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: {app: payment-service}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: payment-service}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: payment-service, tier: service}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      initContainers:
        # same idea as depends_on: service_healthy in docker-compose.yml
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h payment-db -p 5432 -t 2; do echo waiting for payment-db; sleep 2; done"]
      containers:
        - name: payment-service
          image: tatkal/payment-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8003}
          envFrom:
            - configMapRef: {name: payment-service-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-passwords, key: PAYMENT_DB_PASSWORD}
            - name: DATABASE_URL
              value: postgresql+psycopg://payment_svc:$(DB_PASSWORD)@payment-db:5432/payment_db
          lifecycle:
            # keep serving for a few seconds after SIGTERM is due: the Service keeps
            # sending traffic until the pod is removed from its endpoints
            preStop:
              sleep: {seconds: 5}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels: {app: payment-service}
spec:
  selector: {app: payment-service}
  ports:
    - name: http
      port: 8003
      targetPort: http
